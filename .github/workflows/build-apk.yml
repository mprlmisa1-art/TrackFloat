name: Build TrackFloat APK # notification-permission-fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'TrackFloatAndroid-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q TrackFloatAndroid-source.zip -d project

      - name: Add live track notification
        working-directory: project
        run: |
          cat > app/src/main/java/com/example/trackfloat/TrackNotificationListener.kt <<'KOTLIN'
          package com.example.trackfloat

          import android.app.DownloadManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.widget.Toast
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          class TrackNotificationListener : NotificationListenerService() {
              private val youtubeMusicPackage = "com.google.android.apps.youtube.music"
              private val channelId = "trackfloat_now_playing"
              private var trackedController: MediaController? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private var lastShownTrack = ""
              private var lastDiagnostic = ""
              private var lastDiagnosticAt = 0L

              // Some YouTube Music versions do not reliably deliver metadata callbacks.
              // Poll the active MediaSession while the listener is connected.
              private val pollTracks = object : Runnable {
                  override fun run() {
                      refreshController()
                      mainHandler.postDelayed(this, 1500)
                  }
              }

              private val controllerCallback = object : MediaController.Callback() {
                  override fun onMetadataChanged(metadata: MediaMetadata?) { saveAndShowTrack(metadata) }
                  override fun onPlaybackStateChanged(state: android.media.session.PlaybackState?) { refreshController() }
              }

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  createChannel()
                  showDiagnostic("Служба подключена; запускаю опрос")
                  mainHandler.removeCallbacks(pollTracks)
                  mainHandler.post(pollTracks)
              }

              // Android/MIUI may temporarily disconnect notification listeners.
              // Request a system rebind so track updates can resume automatically.
              override fun onListenerDisconnected() {
                  mainHandler.removeCallbacks(pollTracks)
                  trackedController?.unregisterCallback(controllerCallback)
                  trackedController = null
                  showDiagnostic("Служба отключена системой; запрашиваю переподключение")
                  super.onListenerDisconnected()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      requestRebind(ComponentName(this, TrackNotificationListener::class.java))
                  }
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn?.packageName == youtubeMusicPackage) refreshController()
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  if (sbn?.packageName == youtubeMusicPackage) refreshController()
              }

              override fun onDestroy() {
                  mainHandler.removeCallbacks(pollTracks)
                  trackedController?.unregisterCallback(controllerCallback)
                  trackedController = null
                  super.onDestroy()
              }

              private fun refreshController() {
                  try {
                      val manager = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val sessions = manager.getActiveSessions(ComponentName(this, TrackNotificationListener::class.java))
                      val controller = sessions.firstOrNull { it.packageName == youtubeMusicPackage }
                      if (controller !== trackedController) {
                          trackedController?.unregisterCallback(controllerCallback)
                          trackedController = controller
                          trackedController?.registerCallback(controllerCallback)
                      }
                      val state = controller?.playbackState?.state
                      val metadata = controller?.metadata
                      val title = metadata?.getString(MediaMetadata.METADATA_KEY_TITLE).orEmpty()
                      val sessionSummary = sessions.joinToString(",") { it.packageName.substringAfterLast('.') }
                      val status = if (controller == null) {
                          "YouTube Music: сессия НЕ найдена; активных сессий: ${sessions.size} [${sessionSummary}]"
                      } else {
                          "YouTube Music: сессия найдена; state=${state}; title=${title.ifBlank { "пусто" }}; активных сессий: ${sessions.size}"
                      }
                      showDiagnostic(status)
                      metadata?.let { saveAndShowTrack(it) }
                  } catch (e: Exception) {
                      showDiagnostic("Ошибка опроса: ${e.javaClass.simpleName}: ${e.message ?: "без подробностей"}")
                  }
              }

              private fun showDiagnostic(message: String) {
                  val now = System.currentTimeMillis()
                  if (message == lastDiagnostic && now - lastDiagnosticAt < 5000L) return
                  lastDiagnostic = message
                  lastDiagnosticAt = now
                  try {
                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, "trackfloat_debug")
                          else Notification.Builder(this)
                      val notification = builder
                          .setSmallIcon(android.R.drawable.ic_menu_info_details)
                          .setContentTitle("TrackFloat — диагностика")
                          .setContentText(message)
                          .setStyle(Notification.BigTextStyle().bigText(message))
                          .setOnlyAlertOnce(true)
                          .setOngoing(true)
                          .build()
                      getSystemService(NotificationManager::class.java).notify(702, notification)
                  } catch (_: Exception) { }
              }

              private fun saveAndShowTrack(metadata: MediaMetadata?) {
                  metadata ?: return
                  val title = metadata.getString(MediaMetadata.METADATA_KEY_TITLE)?.trim().orEmpty()
                  val artist = (metadata.getString(MediaMetadata.METADATA_KEY_ARTIST)
                      ?: metadata.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST))?.trim().orEmpty()
                  if (title.isBlank()) return
                  val trackKey = "$title|$artist"
                  if (trackKey == lastShownTrack) return
                  lastShownTrack = trackKey
                  getSharedPreferences("track", MODE_PRIVATE).edit()
                      .putString("title", title).putString("artist", artist).apply()
                  showTrackNotification(title, artist)
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(
                          NotificationChannel(channelId, "TrackFloat — сейчас играет", NotificationManager.IMPORTANCE_LOW)
                              .apply { description = "Текущий трек из YouTube Music" }
                      )
                      manager.createNotificationChannel(
                          NotificationChannel("trackfloat_debug", "TrackFloat — диагностика", NotificationManager.IMPORTANCE_LOW)
                              .apply { description = "Состояние подключения к музыкальной сессии" }
                      )
                  }
              }

              private fun showTrackNotification(title: String, artist: String) {
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val contentPendingIntent = PendingIntent.getActivity(
                      this, 701, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or
                          (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  )
                  val downloadIntent = Intent(this, TrackDownloadReceiver::class.java).apply {
                      action = "com.example.trackfloat.DOWNLOAD_CURRENT_TRACK"
                      putExtra("title", title)
                      putExtra("artist", artist)
                  }
                  val downloadPendingIntent = PendingIntent.getBroadcast(
                      this, 703, downloadIntent, PendingIntent.FLAG_UPDATE_CURRENT or
                          (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  )
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, channelId)
                      else Notification.Builder(this)
                  val notification = builder
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText(if (artist.isBlank()) "Сейчас играет" else artist)
                      .setStyle(Notification.BigTextStyle().bigText(if (artist.isBlank()) title else "$title — $artist"))
                      .setContentIntent(contentPendingIntent)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .addAction(android.R.drawable.stat_sys_download, "Скачать MP3", downloadPendingIntent)
                      .build()
                  getSystemService(NotificationManager::class.java).notify(701, notification)
              }
          }

          class TrackDownloadReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val title = intent?.getStringExtra("title").orEmpty()
                  val artist = intent?.getStringExtra("artist").orEmpty()
                  if (title.isBlank()) {
                      Toast.makeText(context, "Сначала включи песню в YouTube Music", Toast.LENGTH_LONG).show()
                      return
                  }
                  val pending = goAsync()
                  Thread {
                      try {
                          val query = listOf(title, artist).filter { it.isNotBlank() }.joinToString(" ")
                          val encoded = URLEncoder.encode("$query AND mediatype:audio", "UTF-8")
                          val search = getJson("https://archive.org/advancedsearch.php?q=$encoded&fl[]=identifier&rows=8&page=1&output=json")
                          val docs = search.getJSONObject("response").getJSONArray("docs")
                          var downloadUrl: String? = null
                          var fileName: String? = null
                          for (i in 0 until minOf(docs.length(), 8)) {
                              val identifier = docs.getJSONObject(i).optString("identifier")
                              if (identifier.isBlank()) continue
                              try {
                                  val metadata = getJson("https://archive.org/metadata/$identifier")
                                  val license = metadata.optJSONObject("metadata")?.optString("licenseurl").orEmpty().lowercase()
                                  val permitted = license.contains("publicdomain") || license.contains("cc0") ||
                                      license.contains("licenses/by/") || license.contains("licenses/by-sa/")
                                  if (!permitted) continue
                                  val files = metadata.optJSONArray("files") ?: continue
                                  for (j in 0 until files.length()) {
                                      val file = files.optJSONObject(j) ?: continue
                                      val name = file.optString("name")
                                      val format = file.optString("format").lowercase()
                                      if (name.lowercase().endsWith(".mp3") && !name.contains("/") &&
                                          (format.contains("mp3") || format.contains("mpeg"))) {
                                          fileName = name
                                          downloadUrl = "https://archive.org/download/$identifier/" + Uri.encode(name, "@#&=*+-_.,:!?()/~'")
                                          break
                                      }
                                  }
                                  if (downloadUrl != null) break
                              } catch (_: Exception) { }
                          }
                          if (downloadUrl == null || fileName == null) {
                              Toast.makeText(context, "Не найден MP3 с подтверждённой свободной лицензией", Toast.LENGTH_LONG).show()
                          } else {
                              val request = DownloadManager.Request(Uri.parse(downloadUrl))
                                  .setTitle(fileName)
                                  .setDescription("TrackFloat — $title")
                                  .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                  .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "TrackFloat_$fileName")
                              (context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(request)
                              Toast.makeText(context, "Загрузка добавлена в «Загрузки»", Toast.LENGTH_LONG).show()
                          }
                      } catch (_: Exception) {
                          Toast.makeText(context, "Не удалось найти или загрузить MP3. Попробуй позже", Toast.LENGTH_LONG).show()
                      } finally { pending.finish() }
                  }.start()
              }

              private fun getJson(address: String): JSONObject {
                  val connection = URL(address).openConnection() as HttpURLConnection
                  connection.connectTimeout = 7000
                  connection.readTimeout = 9000
                  connection.setRequestProperty("User-Agent", "TrackFloat/1.0")
                  return try { JSONObject(connection.inputStream.bufferedReader().use { it.readText() }) }
                  finally { connection.disconnect() }
              }
          }
          KOTLIN

      - name: Enable Internet and download action
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\\n'
          if "android.permission.INTERNET" not in text:
              text = text.replace("<application", permission + "    <application", 1)
          elif "android.permission.POST_NOTIFICATIONS" not in text:
              text = text.replace("<application", '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\\n    <application', 1)
          receiver = '        <receiver android:name=".TrackDownloadReceiver" android:exported="false" />\\n    '
          if "TrackDownloadReceiver" not in text:
              text = text.replace("</application>", receiver + "</application>", 1)
          path.write_text(text)

          # Android 13+ requires a runtime notification permission. Ask when the user opens the app.
          from pathlib import Path
          import re
          candidates = list(Path("app/src/main/java").rglob("MainActivity.kt"))
          if not candidates:
              raise SystemExit("MainActivity.kt not found; cannot request notification permission")
          activity = candidates[0]
          source = activity.read_text()
          marker = "override fun onCreate"
          if marker not in source:
              raise SystemExit("MainActivity.onCreate not found")
          if "POST_NOTIFICATIONS" not in source:
              match = re.search(r"(override\s+fun\s+onCreate\s*\([^)]*\)\s*\{)", source)
              if not match:
                  raise SystemExit("Could not safely locate MainActivity.onCreate body")
              request = '''
                  if (android.os.Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1001)
                  }
              '''
              source = source[:match.end()] + request + source[match.end():]
              activity.write_text(source)
          PY

      - name: Configure Java and Kotlin JVM targets
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()
          marker = "    compileSdk = 35\n"
          if marker not in text:
              raise SystemExit("Could not find compileSdk = 35 in app/build.gradle.kts")
          compile_options = """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          if "compileOptions {" not in text:
              text = text.replace(marker, compile_options, 1)
          if "KotlinCompile" not in text:
              text += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """
          path.write_text(text)
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackFloat-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

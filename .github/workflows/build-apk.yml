name: Build TrackFloat APK # Jamendo-search-build-fixed

on:
  workflow_dispatch:
  push:
    paths:
      - 'TrackFloatAndroid-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q TrackFloatAndroid-source.zip -d project

      - name: Add live track notification
        working-directory: project
        run: |
          cat > app/src/main/java/com/example/trackfloat/TrackNotificationListener.kt <<'KOTLIN'
          package com.example.trackfloat

          import android.app.DownloadManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSession
          import android.media.session.MediaSessionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.widget.Toast
          import androidx.work.Data
          import androidx.work.ExistingWorkPolicy
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.OutOfQuotaPolicy
          import androidx.work.WorkManager
          import androidx.work.CoroutineWorker
          import androidx.work.WorkerParameters
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          class TrackNotificationListener : NotificationListenerService() {
              private val youtubeMusicPackage = "com.google.android.apps.youtube.music"
              private val channelId = "trackfloat_now_playing"
              private var trackedController: MediaController? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private var lastShownTrack = ""
              private var lastDiagnostic = ""
              private var lastDiagnosticAt = 0L

              // Some YouTube Music versions do not reliably deliver metadata callbacks.
              // Poll the active MediaSession while the listener is connected.
              private val pollTracks = object : Runnable {
                  override fun run() {
                      refreshController()
                      mainHandler.postDelayed(this, 1500)
                  }
              }

              private val controllerCallback = object : MediaController.Callback() {
                  override fun onMetadataChanged(metadata: MediaMetadata?) { saveAndShowTrack(metadata) }
                  override fun onPlaybackStateChanged(state: android.media.session.PlaybackState?) { refreshController() }
              }

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  createChannel()
                  showDiagnostic("Служба подключена; запускаю опрос")
                  mainHandler.removeCallbacks(pollTracks)
                  mainHandler.post(pollTracks)
              }

              // Android/MIUI may temporarily disconnect notification listeners.
              // Request a system rebind so track updates can resume automatically.
              override fun onListenerDisconnected() {
                  mainHandler.removeCallbacks(pollTracks)
                  trackedController?.unregisterCallback(controllerCallback)
                  trackedController = null
                  showDiagnostic("Служба отключена системой; запрашиваю переподключение")
                  super.onListenerDisconnected()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      requestRebind(ComponentName(this, TrackNotificationListener::class.java))
                  }
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn?.packageName != youtubeMusicPackage) return
                  // Prefer the session token carried by YouTube Music's own media notification.
                  // This can work even when getActiveSessions() temporarily returns an empty list.
                  val token = try {
                      @Suppress("DEPRECATION")
                      sbn.notification.extras?.getParcelable<MediaSession.Token>(Notification.EXTRA_MEDIA_SESSION)
                  } catch (_: Exception) { null }
                  if (token != null) {
                      try {
                          val fromNotification = MediaController(this, token)
                          if (fromNotification.packageName == youtubeMusicPackage) {
                              if (trackedController?.sessionToken != token) {
                                  trackedController?.unregisterCallback(controllerCallback)
                                  trackedController = fromNotification
                                  trackedController?.registerCallback(controllerCallback)
                              }
                              val metadata = trackedController?.metadata
                              showDiagnostic("YouTube Music: токен из уведомления получен; title=${metadata?.getString(MediaMetadata.METADATA_KEY_TITLE).orEmpty().ifBlank { "пусто" }}")
                              metadata?.let { saveAndShowTrack(it) }
                              return
                          }
                      } catch (e: Exception) {
                          showDiagnostic("Ошибка токена MediaSession: ${e.javaClass.simpleName}: ${e.message ?: "без подробностей"}")
                      }
                  } else {
                      showDiagnostic("Уведомление YouTube Music получено, но MediaSession token отсутствует")
                  }
                  refreshController()
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  if (sbn?.packageName == youtubeMusicPackage) refreshController()
              }

              override fun onDestroy() {
                  mainHandler.removeCallbacks(pollTracks)
                  trackedController?.unregisterCallback(controllerCallback)
                  trackedController = null
                  super.onDestroy()
              }

              private fun refreshController() {
                  try {
                      val manager = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val sessions = manager.getActiveSessions(ComponentName(this, TrackNotificationListener::class.java))
                      val activeController = sessions.firstOrNull { it.packageName == youtubeMusicPackage }
                      // Do not discard a valid controller obtained from the notification token
                      // merely because MIUI temporarily omits it from getActiveSessions().
                      if (activeController != null && trackedController?.sessionToken != activeController.sessionToken) {
                          trackedController?.unregisterCallback(controllerCallback)
                          trackedController = activeController
                          trackedController?.registerCallback(controllerCallback)
                      }
                      val controller = activeController ?: trackedController?.takeIf { it.packageName == youtubeMusicPackage }
                      val state = controller?.playbackState?.state
                      val metadata = controller?.metadata
                      val title = metadata?.getString(MediaMetadata.METADATA_KEY_TITLE).orEmpty()
                      val sessionSummary = sessions.joinToString(",") { it.packageName.substringAfterLast('.') }
                      val status = if (controller == null) {
                          "YouTube Music: сессия НЕ найдена; активных сессий: ${sessions.size} [${sessionSummary}]"
                      } else {
                          val source = if (activeController != null) "список активных сессий" else "токен уведомления"
                          "YouTube Music: сессия найдена через ${source}; state=${state}; title=${title.ifBlank { "пусто" }}; активных сессий: ${sessions.size}"
                      }
                      showDiagnostic(status)
                      metadata?.let { saveAndShowTrack(it) }
                  } catch (e: Exception) {
                      showDiagnostic("Ошибка опроса: ${e.javaClass.simpleName}: ${e.message ?: "без подробностей"}")
                  }
              }

              private fun showDiagnostic(message: String) {
                  val now = System.currentTimeMillis()
                  if (message == lastDiagnostic && now - lastDiagnosticAt < 5000L) return
                  lastDiagnostic = message
                  lastDiagnosticAt = now
                  try {
                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, "trackfloat_debug")
                          else Notification.Builder(this)
                      val notification = builder
                          .setSmallIcon(android.R.drawable.ic_menu_info_details)
                          .setContentTitle("TrackFloat — диагностика")
                          .setContentText(message)
                          .setStyle(Notification.BigTextStyle().bigText(message))
                          .setOnlyAlertOnce(true)
                          .setOngoing(true)
                          .build()
                      getSystemService(NotificationManager::class.java).notify(702, notification)
                  } catch (_: Exception) { }
              }

              private fun saveAndShowTrack(metadata: MediaMetadata?) {
                  metadata ?: return
                  val title = metadata.getString(MediaMetadata.METADATA_KEY_TITLE)?.trim().orEmpty()
                  val artist = (metadata.getString(MediaMetadata.METADATA_KEY_ARTIST)
                      ?: metadata.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST))?.trim().orEmpty()
                  if (title.isBlank()) return
                  val trackKey = "$title|$artist"
                  if (trackKey == lastShownTrack) return
                  lastShownTrack = trackKey
                  getSharedPreferences("track", MODE_PRIVATE).edit()
                      .putString("title", title).putString("artist", artist).apply()
                  showTrackNotification(title, artist)
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(
                          NotificationChannel(channelId, "TrackFloat — сейчас играет", NotificationManager.IMPORTANCE_LOW)
                              .apply { description = "Текущий трек из YouTube Music" }
                      )
                      manager.createNotificationChannel(
                          NotificationChannel("trackfloat_debug", "TrackFloat — диагностика", NotificationManager.IMPORTANCE_LOW)
                              .apply { description = "Состояние подключения к музыкальной сессии" }
                      )
                  }
              }

              private fun showTrackNotification(title: String, artist: String) {
                  val openIntent = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val contentPendingIntent = PendingIntent.getActivity(
                      this, 701, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or
                          (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  )
                  val downloadIntent = Intent(this, TrackDownloadReceiver::class.java).apply {
                      action = "com.example.trackfloat.DOWNLOAD_CURRENT_TRACK"
                      putExtra("title", title)
                      putExtra("artist", artist)
                  }
                  val downloadPendingIntent = PendingIntent.getBroadcast(
                      this, 703, downloadIntent, PendingIntent.FLAG_UPDATE_CURRENT or
                          (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  )
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, channelId)
                      else Notification.Builder(this)
                  val notification = builder
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText(if (artist.isBlank()) "Сейчас играет" else artist)
                      .setStyle(Notification.BigTextStyle().bigText(if (artist.isBlank()) title else "$title — $artist"))
                      .setContentIntent(contentPendingIntent)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .addAction(android.R.drawable.stat_sys_download, "Скачать MP3", downloadPendingIntent)
                      .build()
                  getSystemService(NotificationManager::class.java).notify(701, notification)
              }
          }

          class TrackDownloadReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val title = intent?.getStringExtra("title").orEmpty()
                  val artist = intent?.getStringExtra("artist").orEmpty()
                  if (title.isBlank()) return
                  val request = OneTimeWorkRequestBuilder<TrackDownloadWorker>()
                      .setInputData(Data.Builder().putString("title", title).putString("artist", artist).build())
                      .setExpedited(OutOfQuotaPolicy.RUN_AS_NON_EXPEDITED_WORK_REQUEST)
                      .build()
                  WorkManager.getInstance(context.applicationContext).enqueueUniqueWork(
                      "trackfloat_download_current", ExistingWorkPolicy.REPLACE, request
                  )
              }
          }

          class TrackDownloadWorker(context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {
              private val youtubeApiKey = "YOUTUBE_API_KEY_PLACEHOLDER"

              override suspend fun doWork(): Result {
                  val title = inputData.getString("title").orEmpty()
                  val artist = inputData.getString("artist").orEmpty()
                  if (title.isBlank()) return Result.failure()
                  postStatus("Ищу: ${title}", "Сверяю название и исполнителя с YouTube")
                  return try {
                      val youtubeMatch = searchYoutube(title, artist)
                      if (youtubeMatch != null) {
                          postStatus("YouTube: ${youtubeMatch.first}", "Канал: ${youtubeMatch.second}; проверяю доступные для загрузки источники")
                      }
                      var downloadUrl: String? = null
                      var fileName: String? = null
                      // First try Audius: public read-only search, and download only tracks marked downloadable.
                      val audiusResult = searchAudius(title, artist)
                      if (audiusResult != null) {
                          downloadUrl = audiusResult.first
                          fileName = "${safeTrackName(title, artist)}.mp3"
                      }

                      // Second try Jamendo: its API explicitly reports whether downloads are allowed.
                      // This public test client_id is for development/testing only; replace with your own registered ID before public release.
                      if (downloadUrl == null) {
                          val jamendoUrl = searchJamendo(title, artist)
                          if (jamendoUrl != null) {
                              downloadUrl = jamendoUrl
                              fileName = "${safeTrackName(title, artist)}.mp3"
                          }
                      }


                      // Openverse: aggregated search for openly licensed audio, restricted to MP3 and reusable licenses.
                      if (downloadUrl == null) {
                          val openverseResult = searchOpenverse(title, artist)
                          if (openverseResult != null) {
                              downloadUrl = openverseResult.first
                              fileName = "${safeTrackName(title, artist)}.mp3"
                          }
                      }

                      // Fallback: Internet Archive, but only when its metadata explicitly identifies a permissive license.
                      if (downloadUrl == null) {
                          val query = "title:${title.quoteForArchive()}" +
                              if (artist.isNotBlank()) " AND creator:${artist.quoteForArchive()}" else ""
                          val encoded = URLEncoder.encode("$query AND mediatype:audio", "UTF-8")
                          val search = getJson("https://archive.org/advancedsearch.php?q=$encoded&fl[]=identifier,title,creator&rows=12&page=1&output=json")
                          val docs = search.getJSONObject("response").getJSONArray("docs")
                          val wantedTitle = normalize(title)
                          val wantedArtist = normalize(artist)

                          for (i in 0 until minOf(docs.length(), 12)) {
                              val doc = docs.optJSONObject(i) ?: continue
                              val identifier = doc.optString("identifier")
                              val resultTitle = normalize(doc.optString("title"))
                              val resultArtist = normalize(doc.optString("creator"))
                              if (identifier.isBlank() || resultTitle.isBlank()) continue
                              if (!resultTitle.contains(wantedTitle) && !wantedTitle.contains(resultTitle)) continue
                              if (wantedArtist.isNotBlank() && resultArtist.isNotBlank() &&
                                  !resultArtist.contains(wantedArtist) && !wantedArtist.contains(resultArtist)) continue
                              try {
                                  val metadata = getJson("https://archive.org/metadata/$identifier")
                                  val license = metadata.optJSONObject("metadata")?.optString("licenseurl").orEmpty().lowercase()
                                  val permitted = license.contains("publicdomain") || license.contains("cc0") ||
                                      license.contains("licenses/by/") || license.contains("licenses/by-sa/")
                                  if (!permitted) continue
                                  val files = metadata.optJSONArray("files") ?: continue
                                  for (j in 0 until files.length()) {
                                      val file = files.optJSONObject(j) ?: continue
                                      val name = file.optString("name")
                                      val format = file.optString("format").lowercase()
                                      if (name.lowercase().endsWith(".mp3") && !name.contains("/") &&
                                          (format.contains("mp3") || format.contains("mpeg"))) {
                                          fileName = name
                                          downloadUrl = "https://archive.org/download/$identifier/" +
                                              Uri.encode(name, "@#&=*+-_.,:!?()/~'")
                                          break
                                      }
                                  }
                                  if (downloadUrl != null) break
                              } catch (_: Exception) { }
                          }
                      }

                      if (downloadUrl == null || fileName == null) {
                          postStatus("Не найдено: ${title}", "Нет точного совпадения с подтверждённой свободной лицензией")
                          Result.success()
                      } else {
                          postStatus("Загружаю: ${title}", "Файл сохраняется в папку Download")
                          val safeName = fileName!!.replace("/", "_")
                          val request = DownloadManager.Request(Uri.parse(downloadUrl!!))
                              .setTitle(title)
                              .setDescription(if (artist.isBlank()) "TrackFloat" else "TrackFloat — $artist")
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "TrackFloat_$safeName")
                          (applicationContext.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(request)
                          Result.success()
                      }
                  } catch (_: Exception) {
                      postStatus("Ошибка поиска: ${title}", "Не удалось выполнить поиск. Попробуй ещё раз")
                      Result.retry()
                  }
              }

              private fun postStatus(title: String, message: String) {
                  val manager = applicationContext.getSystemService(NotificationManager::class.java)
                  val channel = "trackfloat_download"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      manager.createNotificationChannel(NotificationChannel(channel, "TrackFloat — загрузки", NotificationManager.IMPORTANCE_LOW))
                  }
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      Notification.Builder(applicationContext, channel) else Notification.Builder(applicationContext)
                  manager.notify(704, builder.setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle(title).setContentText(message).setOnlyAlertOnce(true).setAutoCancel(true).build())
              }

              private fun searchYoutube(title: String, artist: String): Pair<String, String>? {
                  if (youtubeApiKey.isBlank() || youtubeApiKey == "YOUTUBE_API_KEY_PLACEHOLDER") return null
                  return try {
                      val query = if (artist.isBlank()) title else "$title $artist"
                      val address = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=10&q=" +
                          URLEncoder.encode(query, "UTF-8") + "&key=" + URLEncoder.encode(youtubeApiKey, "UTF-8")
                      val response = getJson(address)
                      val items = response.optJSONArray("items") ?: return null
                      val wantedTitle = normalize(title)
                      val wantedArtist = normalize(artist)
                      var best: Pair<String, String>? = null
                      var bestScore = 0
                      for (i in 0 until items.length()) {
                          val item = items.optJSONObject(i) ?: continue
                          val snippet = item.optJSONObject("snippet") ?: continue
                          val foundTitle = normalize(snippet.optString("title"))
                          val foundChannel = normalize(snippet.optString("channelTitle"))
                          val titleMatches = foundTitle == wantedTitle ||
                              (foundTitle.isNotBlank() && wantedTitle.isNotBlank() &&
                               (foundTitle.contains(wantedTitle) || wantedTitle.contains(foundTitle)))
                          if (!titleMatches) continue
                          val artistMatches = wantedArtist.isBlank() || foundChannel == wantedArtist ||
                              (foundChannel.isNotBlank() &&
                               (foundChannel.contains(wantedArtist) || wantedArtist.contains(foundChannel)))
                          val score = (if (foundTitle == wantedTitle) 2 else 1) + (if (artistMatches) 2 else 0)
                          if (score > bestScore) {
                              bestScore = score
                              best = Pair(snippet.optString("title"), snippet.optString("channelTitle"))
                          }
                      }
                      if (bestScore >= if (wantedArtist.isBlank()) 1 else 3) best else null
                  } catch (_: Exception) { null }
              }

              private fun searchAudius(title: String, artist: String): Pair<String, String>? {
                  return try {
                      val query = if (artist.isBlank()) title else "$title $artist"
                      val address = "https://api.audius.co/v1/tracks/search?query=" +
                          URLEncoder.encode(query, "UTF-8") + "&limit=25&only_downloadable=true&app_name=TrackFloat"
                      val response = getJson(address)
                      val results = response.optJSONArray("data") ?: return null
                      val wantedTitle = normalize(title)
                      val wantedArtist = normalize(artist)
                      for (i in 0 until results.length()) {
                          val track = results.optJSONObject(i) ?: continue
                          val foundTitle = normalize(track.optString("title"))
                          val user = track.optJSONObject("user")
                          val foundArtist = normalize(user?.optString("name").orEmpty())
                          val titleMatches = foundTitle == wantedTitle ||
                              (foundTitle.isNotBlank() && wantedTitle.isNotBlank() &&
                               (foundTitle.contains(wantedTitle) || wantedTitle.contains(foundTitle)))
                          val artistMatches = wantedArtist.isBlank() || foundArtist == wantedArtist ||
                              (foundArtist.isNotBlank() &&
                               (foundArtist.contains(wantedArtist) || wantedArtist.contains(foundArtist)))
                          if (!titleMatches || !artistMatches || !track.optBoolean("is_downloadable", false)) continue
                          val id = track.optString("id")
                          if (id.isBlank()) continue
                          val download = "https://api.audius.co/v1/tracks/$id/download?app_name=TrackFloat"
                          return Pair(download, track.optString("title"))
                      }
                      null
                  } catch (_: Exception) { null }
              }


              private fun searchOpenverse(title: String, artist: String): Pair<String, String>? {
                  return try {
                      val query = if (artist.isBlank()) title else "$title $artist"
                      val address = "https://api.openverse.org/v1/audio/?q=" +
                          URLEncoder.encode(query, "UTF-8") +
                          "&page_size=30&license=cc0,by,by-sa,pdm&extension=mp3&category=music"
                      val response = getJson(address)
                      val results = response.optJSONArray("results") ?: return null
                      val wantedTitle = normalize(title)
                      val wantedArtist = normalize(artist)
                      for (i in 0 until results.length()) {
                          val track = results.optJSONObject(i) ?: continue
                          val foundTitle = normalize(track.optString("title"))
                          val foundArtist = normalize(track.optString("creator"))
                          val mediaUrl = track.optString("url")
                          val license = track.optString("license").lowercase()
                          val titleMatches = foundTitle == wantedTitle ||
                              (foundTitle.isNotBlank() && wantedTitle.isNotBlank() &&
                               (foundTitle.contains(wantedTitle) || wantedTitle.contains(foundTitle)))
                          val artistMatches = wantedArtist.isBlank() || foundArtist == wantedArtist ||
                              (foundArtist.isNotBlank() &&
                               (foundArtist.contains(wantedArtist) || wantedArtist.contains(foundArtist)))
                          val permittedLicense = license == "cc0" || license == "pdm" ||
                              license == "by" || license == "by-sa"
                          if (!titleMatches || !artistMatches || !permittedLicense ||
                              !mediaUrl.startsWith("https://")) continue
                          return Pair(mediaUrl, track.optString("title"))
                      }
                      null
                  } catch (_: Exception) { null }
              }

              private fun searchJamendo(title: String, artist: String): String? {
                  return try {
                      val clientId = "709fa152" // Jamendo public test ID; replace with your own registered ID for release.
                      val params = StringBuilder()
                      params.append("client_id=").append(URLEncoder.encode(clientId, "UTF-8"))
                      params.append("&format=json&limit=30&namesearch=").append(URLEncoder.encode(title, "UTF-8"))
                      params.append("&audiodlformat=mp32&include=licenses&track_type=single+albumtrack")
                      if (artist.isNotBlank()) {
                          params.append("&artist_name=").append(URLEncoder.encode(artist, "UTF-8"))
                      }
                      val response = getJson("https://api.jamendo.com/v3.0/tracks/?$params")
                      val results = response.optJSONArray("results") ?: return null
                      val wantedTitle = normalize(title)
                      val wantedArtist = normalize(artist)
                      for (i in 0 until results.length()) {
                          val track = results.optJSONObject(i) ?: continue
                          val foundTitle = normalize(track.optString("name"))
                          val foundArtist = normalize(track.optString("artist_name"))
                          val titleMatches = foundTitle == wantedTitle ||
                              (foundTitle.isNotBlank() && wantedTitle.isNotBlank() &&
                               (foundTitle.contains(wantedTitle) || wantedTitle.contains(foundTitle)))
                          val artistMatches = wantedArtist.isBlank() || foundArtist == wantedArtist ||
                              (foundArtist.isNotBlank() && (foundArtist.contains(wantedArtist) || wantedArtist.contains(foundArtist)))
                          if (!titleMatches || !artistMatches || !track.optBoolean("audiodownload_allowed", false)) continue
                          val direct = track.optString("audiodownload")
                          if (direct.startsWith("https://")) return direct
                          val id = track.optString("id")
                          if (id.isNotBlank()) {
                              return "https://api.jamendo.com/v3.0/tracks/file/?client_id=$clientId&id=$id&audioformat=mp32&action=download"
                          }
                      }
                      null
                  } catch (_: Exception) { null }
              }

              private fun safeTrackName(title: String, artist: String): String =
                  (if (artist.isBlank()) title else "$artist - $title")
                      .map { ch -> if (ch in charArrayOf('/', '\\', ':', '*', '?', '"', '<', '>', '|')) '_' else ch }
                      .joinToString("").take(100)

              private fun normalize(value: String): String =
                  value.lowercase().replace(Regex("[^\\p{L}\\p{N}]"), "")

              private fun String.quoteForArchive(): String =
                  "\"" + replace("\\", " ").replace("\"", " ").trim() + "\""

              private fun getJson(address: String): JSONObject {
                  val connection = URL(address).openConnection() as HttpURLConnection
                  connection.connectTimeout = 7000
                  connection.readTimeout = 9000
                  connection.setRequestProperty("User-Agent", "TrackFloat/1.0")
                  return try { JSONObject(connection.inputStream.bufferedReader().use { it.readText() }) }
                  finally { connection.disconnect() }
              }
          }
          KOTLIN

      - name: Inject YouTube API key
        working-directory: project
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("app/src/main/java/com/example/trackfloat/TrackNotificationListener.kt")
          source = path.read_text()
          marker = 'private val youtubeApiKey = "YOUTUBE_API_KEY_PLACEHOLDER"'
          key = os.environ.get("YOUTUBE_API_KEY", "").strip()
          if not key:
              raise SystemExit("GitHub secret YOUTUBE_API_KEY is missing")
          if marker not in source:
              raise SystemExit("YouTube API key placeholder not found")
          source = source.replace(marker, 'private val youtubeApiKey = "' + key.replace('\\', '\\\\').replace('"', '\\"') + '"', 1)
          path.write_text(source)
          PY

      - name: Enable Internet and download action
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\\n'
          if "android.permission.INTERNET" not in text:
              text = text.replace("<application", permission + "    <application", 1)
          elif "android.permission.POST_NOTIFICATIONS" not in text:
              text = text.replace("<application", '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\\n    <application', 1)
          receiver = '        <receiver android:name=".TrackDownloadReceiver" android:exported="false" />\\n    '
          if "TrackDownloadReceiver" not in text:
              text = text.replace("</application>", receiver + "</application>", 1)
          path.write_text(text)

          # Android 13+ requires a runtime notification permission. Ask when the user opens the app.
          from pathlib import Path
          import re
          candidates = list(Path("app/src/main/java").rglob("MainActivity.kt"))
          if not candidates:
              raise SystemExit("MainActivity.kt not found; cannot request notification permission")
          activity = candidates[0]
          source = activity.read_text()
          marker = "override fun onCreate"
          if marker not in source:
              raise SystemExit("MainActivity.onCreate not found")
          if "POST_NOTIFICATIONS" not in source:
              match = re.search(r"(override\s+fun\s+onCreate\s*\([^)]*\)\s*\{)", source)
              if not match:
                  raise SystemExit("Could not safely locate MainActivity.onCreate body")
              request = '''
                  if (android.os.Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1001)
                  }
              '''
              source = source[:match.end()] + request + source[match.end():]
              activity.write_text(source)
          PY

      - name: Configure Java and Kotlin JVM targets
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()
          if "androidx.work:work-runtime-ktx" not in text:
              text += '\n\ndependencies {\n    implementation("androidx.work:work-runtime-ktx:2.10.0")\n}\n'
          marker = "    compileSdk = 35\n"
          if marker not in text:
              raise SystemExit("Could not find compileSdk = 35 in app/build.gradle.kts")
          compile_options = """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          if "compileOptions {" not in text:
              text = text.replace(marker, compile_options, 1)
          if "KotlinCompile" not in text:
              text += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """
          path.write_text(text)
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackFloat-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build TrackFloat APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TrackFloatAndroid-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q TrackFloatAndroid-source.zip -d project

      - name: Fix YouTube Music track detection
        working-directory: project
        run: |
          cat > app/src/main/java/com/example/trackfloat/TrackNotificationListener.kt <<'KOTLIN'
          package com.example.trackfloat

          import android.content.ComponentName
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class TrackNotificationListener : NotificationListenerService() {

              private val youtubeMusicPackage = "com.google.android.apps.youtube.music"

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  updateTrackFromMediaSession()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn?.packageName == youtubeMusicPackage) {
                      updateTrackFromMediaSession()
                  }
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  if (sbn?.packageName == youtubeMusicPackage) {
                      updateTrackFromMediaSession()
                  }
              }

              private fun updateTrackFromMediaSession() {
                  try {
                      val manager = getSystemService(MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val sessions = manager.getActiveSessions(
                          ComponentName(this, TrackNotificationListener::class.java)
                      )
                      val controller = sessions.firstOrNull {
                          it.packageName == youtubeMusicPackage
                      } ?: return

                      val metadata: MediaMetadata = controller.metadata ?: return
                      val title = metadata.getString(MediaMetadata.METADATA_KEY_TITLE)
                          ?.trim().orEmpty()
                      val artist = (
                          metadata.getString(MediaMetadata.METADATA_KEY_ARTIST)
                              ?: metadata.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST)
                          )?.trim().orEmpty()

                      if (title.isNotBlank()) {
                          getSharedPreferences("track", MODE_PRIVATE).edit()
                              .putString("title", title)
                              .putString("artist", artist)
                              .apply()
                      }
                  } catch (_: SecurityException) {
                      // Notification access may not yet be fully connected.
                  } catch (_: Exception) {
                      // Ignore transient media-session errors.
                  }
              }
          }
          KOTLIN

      - name: Configure Java and Kotlin JVM targets
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          marker = "    compileSdk = 35\n"
          if marker not in text:
              raise SystemExit("Could not find compileSdk = 35 in app/build.gradle.kts")

          compile_options = """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          text = text.replace(marker, compile_options, 1)

          text += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """
          path.write_text(text)
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackFloat-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
